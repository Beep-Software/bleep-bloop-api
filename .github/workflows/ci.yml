name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: beep-software/bleep-bloop-api

jobs:
  build-and-deploy:
    runs-on: [self-hosted, k3s]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Clean Docker build cache
        if: always()
        run: |
          docker builder prune --all --force
          docker image prune --all --force

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG=${{ github.sha }}

          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG

      - name: Create/update email secrets
        if: github.event_name == 'push'
        env:
          KUBECONFIG: /home/dobowe01/.kube/config
        run: |
          kubectl create secret generic bleep-bloop-api-email \
            -n default \
            --from-literal=GMAIL_USER="${{ secrets.GMAIL_USER }}" \
            --from-literal=GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}" \
            --from-literal=DEFAULT_EMAIL_TO="${{ secrets.DEFAULT_EMAIL_TO }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update database secrets
        if: github.event_name == 'push'
        env:
          KUBECONFIG: /home/dobowe01/.kube/config
        run: |
          kubectl create secret generic bleep-bloop-api-database \
            -n default \
            --from-literal=DB_USER="${{ secrets.DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=DB_SERVER="${{ secrets.DB_SERVER }}" \
            --from-literal=DB_PORT="${{ secrets.DB_PORT }}" \
            --from-literal=DB_NAME="${{ secrets.DB_NAME }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        if: github.event_name == 'push'
        env:
          KUBECONFIG: /home/dobowe01/.kube/config
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update image
        if: github.event_name == 'push'
        env:
          KUBECONFIG: /home/dobowe01/.kube/config
        run: |
          kubectl set image deployment/bleep-bloop-api \
            bleep-bloop-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n default

      - name: Wait for deployment
        if: github.event_name == 'push'
        env:
          KUBECONFIG: /home/dobowe01/.kube/config
        run: |
          kubectl rollout status deployment/bleep-bloop-api \
            -n default \
            --timeout=5m

      - name: Clean Docker build cache
        if: always()
        run: |
          docker builder prune --all --force
          docker image prune --all --force